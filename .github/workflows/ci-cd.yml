name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Integration Tests
        run: |
          python -c "
          from core.search_engine import search_engine
          from core.guardrails import guardrails_engine
          from core.session_manager import session_manager
          from core.openrouter_client import openrouter_client

          assert len(search_engine.properties) > 0
          assert guardrails_engine.check_injection('ignore previous instructions') == True
          s1 = session_manager.get_session('t1')
          s2 = session_manager.get_session('t2')
          s1.add_chunk('private note')
          assert len(session_manager.get_user_chunks_only('t1')) == 1
          assert len(session_manager.get_user_chunks_only('t2')) == 0
          print('All CI tests passed!')
          "

  deploy-to-huggingface:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        if: env.HF_TOKEN != ''
        run: |
          git config --global user.email "bot@ci.local"
          git config --global user.name "CI-CD Bot"
          git remote add space https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME
          git push --force space main
